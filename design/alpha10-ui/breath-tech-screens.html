<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>同看 Alpha 10 · Breath Tech 高保真设计稿</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+SC:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
/* ============================================================
   Breath Tech · Design Tokens (对齐 breath-tech.css 真源)
   ============================================================ */
:root{
  --studio:#eef1f5;--studio-ink:#0a0c10;--studio-muted:#737a87;--studio-line:rgba(13,18,28,.09);
  --ease-out:cubic-bezier(.16,1,.3,1);--ease-in:cubic-bezier(.7,0,.84,0);
  --dur-micro:120ms;--dur-short:220ms;--dur-long:420ms;
  --font:"Inter","Noto Sans SC",-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
  --mono:"SFMono-Regular",Consolas,"Liberation Mono",monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:var(--font);background:var(--studio);color:var(--studio-ink);-webkit-font-smoothing:antialiased}
button,input{font:inherit}button{cursor:pointer}

.studio{min-height:100vh;padding:34px 30px 60px;background:radial-gradient(circle at 50% 8%,rgba(255,255,255,.92),transparent 30%),var(--studio);transition:background .3s}
.studio.dark{--studio:#07090c;--studio-ink:#f4f6f9;--studio-muted:#858c99;--studio-line:rgba(255,255,255,.09);color:var(--studio-ink);background:radial-gradient(circle at 50% 6%,rgba(82,105,168,.14),transparent 28%),var(--studio)}
.studio-header{max-width:1500px;margin:0 auto 30px;display:flex;align-items:flex-start;justify-content:space-between;gap:28px;flex-wrap:wrap}
.studio-code{font:600 10px/1 var(--mono);letter-spacing:.16em;color:var(--studio-muted)}
.studio h1{margin:9px 0 0;font-size:34px;line-height:1;letter-spacing:-.055em}
.studio-header p{margin:9px 0 0;color:var(--studio-muted);font-size:13px;max-width:520px;line-height:1.6}
.studio-controls{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end;align-items:center}
.theme-toggle{display:flex;gap:2px;padding:3px;border:1px solid var(--studio-line);border-radius:11px;background:color-mix(in srgb,var(--studio) 80%,transparent);backdrop-filter:blur(18px)}
.theme-toggle button{height:34px;padding:0 16px;border:0;border-radius:8px;background:transparent;color:var(--studio-muted);font-size:12px;font-weight:600;transition:color var(--dur-micro),background var(--dur-micro),transform var(--dur-micro)}
.theme-toggle button:active{transform:scale(.97)}
.theme-toggle button.active{background:var(--studio-ink);color:var(--studio)}

.section-block{max-width:1500px;margin:0 auto 8px}
.section-block h2{margin:46px 0 4px;font-size:19px;letter-spacing:-.03em}
.section-block h2 .sec-idx{font:600 11px/1 var(--mono);letter-spacing:.14em;color:var(--studio-muted);margin-right:10px}
.section-block .sec-desc{margin:0 0 18px;color:var(--studio-muted);font-size:12.5px;line-height:1.55;max-width:640px}

.grid{display:flex;flex-wrap:wrap;gap:34px 30px;align-items:flex-start}
.frame{width:390px}
.frame.wide{width:auto}
.frame-meta{display:flex;align-items:baseline;justify-content:space-between;gap:10px;padding:0 4px 9px;color:var(--studio-muted);font:600 9px/1.3 var(--mono);letter-spacing:.08em}
.frame-meta strong{color:var(--studio-ink);font-weight:600;font-family:var(--font);font-size:12px;letter-spacing:0}
.frame-meta .tag{padding:2px 7px;border:1px solid var(--studio-line);border-radius:6px}

.device{width:390px;height:844px;padding:5px;border-radius:39px;background:#15171b;box-shadow:0 22px 50px rgba(15,20,30,.20)}
.studio.dark .device{box-shadow:0 26px 66px rgba(0,0,0,.5)}
.device.land{width:844px;height:404px;border-radius:34px}

.screen{position:relative;height:100%;overflow:hidden;border-radius:34px;color:var(--ink);background:var(--bg);
  --bg:#f7f8fa;--ink:#0b0d12;--muted:#777e8b;--faint:#a5aab4;--line:rgba(12,17,25,.085);
  --panel:rgba(255,255,255,.68);--panel-strong:rgba(255,255,255,.88);--field:rgba(241,243,247,.78);
  --cta:#101218;--cta-ink:#fff;--accent:#637fff;--accent-soft:rgba(99,127,255,.12);--glow:rgba(94,124,255,.18);--danger:#d84952;--ok:#3d9b6a}
.device.land .screen{border-radius:30px}
.studio.dark .screen{--bg:#05070a;--ink:#f5f7fa;--muted:#858c98;--faint:#5f6672;--line:rgba(255,255,255,.085);
  --panel:rgba(15,18,24,.62);--panel-strong:rgba(17,20,27,.88);--field:rgba(17,20,27,.76);
  --cta:#f4f6f9;--cta-ink:#090b0f;--accent:#91a7ff;--accent-soft:rgba(145,167,255,.12);--glow:rgba(111,139,255,.20);--danger:#ff727a;--ok:#4fbd85}
.screen:before{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:44px 44px;mask-image:linear-gradient(to bottom,rgba(0,0,0,.38),transparent 46%);opacity:.34;z-index:0}
.screen:after{content:"";position:absolute;z-index:0;top:-110px;left:50%;width:310px;height:240px;transform:translateX(-50%);border-radius:50%;background:radial-gradient(circle,var(--glow),transparent 68%);opacity:.7}
.device.land .screen:after{width:420px;top:-140px}

.status-camera{position:absolute;z-index:10;top:14px;left:50%;width:10px;height:10px;transform:translateX(-50%);border-radius:50%;background:#08090b;box-shadow:0 0 0 2px rgba(255,255,255,.05)}
.statusbar{position:absolute;z-index:9;top:0;left:0;right:0;height:44px;padding:13px 20px 0;display:flex;align-items:flex-start;justify-content:space-between;font:600 10px/1 var(--font);color:var(--ink)}
.system-icons{display:flex;align-items:center;gap:5px}
.system-icons svg{width:15px;height:11px;fill:none;stroke:currentColor;stroke-width:1.5}
.system-icons svg:last-child{width:21px}

.page{position:absolute;z-index:2;inset:0;padding:52px 21px 84px;overflow:hidden}
.page-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:20px}
.page-index{font:600 9px/1.2 var(--mono);letter-spacing:.13em;color:var(--muted)}
.page-title{margin:7px 0 0;font-size:31px;line-height:1;letter-spacing:-.055em;font-weight:700}
.page-note{margin:8px 0 0;max-width:250px;color:var(--muted);font-size:11px;line-height:1.55}
svg.ico{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}

.icon-btn{width:44px;height:44px;padding:0;border:1px solid var(--line);border-radius:13px;display:grid;place-items:center;background:var(--panel);color:var(--ink);backdrop-filter:blur(16px)}
.icon-btn.ghost{border-color:transparent;background:transparent;backdrop-filter:none}
.button{position:relative;min-height:47px;padding:0 17px;border:1px solid var(--line);border-radius:14px;display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--panel);color:var(--ink);font-size:13px;font-weight:600;overflow:hidden}
.button.primary{background:var(--cta);color:var(--cta-ink);border-color:color-mix(in srgb,var(--cta) 84%,var(--line));box-shadow:0 14px 38px rgba(14,18,26,.13),0 0 0 1px color-mix(in srgb,var(--accent) 9%,transparent)}
.studio.dark .button.primary{box-shadow:0 16px 44px rgba(0,0,0,.34),0 0 28px rgba(120,146,255,.07)}
.button.full{width:100%}
.button.danger{color:var(--danger);background:transparent;border-color:color-mix(in srgb,var(--danger) 24%,var(--line));box-shadow:none}
.button:disabled,.button.disabled{opacity:.46}
.button-row{display:grid;grid-template-columns:1.3fr .9fr;gap:9px}
.button svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.85}
.button.primary svg[data-fill]{fill:currentColor;stroke:none}

.panel{position:relative;border:1px solid var(--line);border-radius:19px;background:var(--panel);backdrop-filter:blur(18px)}
.panel.strong{background:var(--panel-strong)}
.label-row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:22px 0 10px}
.section-label{font-size:13px;font-weight:600;letter-spacing:-.01em}
.section-meta{color:var(--muted);font:500 9px/1 var(--mono);letter-spacing:.06em}
.mono{font-family:var(--mono)}

.presence{padding:15px 16px}
.presence-line{display:flex;align-items:center;gap:11px}
.avatar{width:37px;height:37px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:700;color:#fff;background:#20232a;border:1px solid rgba(255,255,255,.18);flex:0 0 auto}
.avatar.second{background:#737b8c}
.avatar.dim{background:color-mix(in srgb,var(--muted) 55%,transparent);opacity:.7}
.link-track{position:relative;flex:1;height:1px;background:var(--line)}
.link-track:before,.link-track:after{content:"";position:absolute;top:50%;width:6px;height:6px;border-radius:50%;background:var(--accent);box-shadow:0 0 13px var(--accent);transform:translateY(-50%)}
.link-track:before{left:0}.link-track:after{right:0}
.link-track.broken{background:repeating-linear-gradient(90deg,var(--line) 0 5px,transparent 5px 10px)}
.link-track.broken:after{background:var(--faint);box-shadow:none}
.presence-copy{display:flex;justify-content:space-between;margin-top:11px;color:var(--muted);font-size:10px}
.presence-copy strong{color:var(--ink);font-weight:600}
.dot{display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 4px var(--accent-soft),0 0 10px var(--accent);margin-right:5px;vertical-align:middle}
.dot.off{background:var(--faint);box-shadow:none}

/* now card */
.now-card{padding:18px;margin-top:11px;overflow:hidden;min-height:200px}
.now-card:before{content:"";position:absolute;right:-55px;top:-72px;width:160px;height:160px;border-radius:50%;background:radial-gradient(circle,var(--glow),transparent 69%)}
.now-top{position:relative;display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.now-code{font:600 9px/1 var(--mono);letter-spacing:.12em;color:var(--muted)}
.now-status{font:600 9px/1 var(--mono);color:var(--accent)}
.now-title{position:relative;margin:22px 0 5px;font-size:24px;font-weight:700;letter-spacing:-.04em;max-width:236px}
.now-sub{position:relative;color:var(--muted);font-size:10px;max-width:250px;line-height:1.5}
.now-card .button-row{position:relative;margin-top:17px}
.signal-orbit{position:absolute;right:8px;top:20px;width:110px;height:80px;pointer-events:none}
.signal-orbit:before,.signal-orbit:after{content:"";position:absolute;border:1px solid var(--line);border-radius:50%;transform:rotate(-13deg)}
.signal-orbit:before{inset:9px 2px}.signal-orbit:after{inset:22px 19px}
.signal-orbit span{position:absolute;width:4px;height:4px;border-radius:50%;background:var(--accent);box-shadow:0 0 12px var(--accent)}
.signal-orbit span:nth-child(1){right:14px;top:22px}.signal-orbit span:nth-child(2){left:28px;bottom:14px;opacity:.55}.signal-orbit span:nth-child(3){left:53px;top:39px;width:2px;height:2px}

.stream-list{border-top:1px solid var(--line)}
.stream-row{min-height:62px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--line);padding:8px 2px}
.stream-row:last-child{border-bottom:0}
.row-icon{width:34px;height:34px;flex:0 0 auto;border-radius:11px;display:grid;place-items:center;color:var(--muted);background:var(--field)}
.row-icon svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.75}
.row-main{min-width:0;flex:1}
.row-title{font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-sub{margin-top:4px;color:var(--muted);font-size:9px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-end{color:var(--faint);font:500 9px/1 var(--mono);flex:0 0 auto}

.metrics{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin-top:11px}
.metric{padding:14px 11px;border-right:1px solid var(--line)}
.metric:last-child{border-right:0}
.metric strong{display:block;font-size:18px;letter-spacing:-.035em}
.metric span{display:block;margin-top:5px;color:var(--muted);font-size:9px}

.bottom-nav{position:absolute;z-index:12;left:0;right:0;bottom:0;height:74px;padding:8px 14px;display:grid;grid-template-columns:repeat(4,1fr);background:linear-gradient(to top,var(--bg) 76%,color-mix(in srgb,var(--bg) 80%,transparent));border-top:1px solid var(--line);backdrop-filter:blur(20px)}
.nav-btn{position:relative;border:0;background:transparent;color:var(--muted);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:8px}
.nav-btn svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.75}
.nav-btn:after{content:"";position:absolute;bottom:3px;width:13px;height:1px;background:var(--accent);box-shadow:0 0 9px var(--accent);opacity:0}
.nav-btn.active{color:var(--ink)}
.nav-btn.active:after{opacity:1}

.field{position:relative}
.field label{display:block;margin-bottom:8px;color:var(--muted);font:600 9px/1 var(--mono);letter-spacing:.09em}
.field input,.search input{width:100%;height:48px;border:1px solid var(--line);border-radius:14px;background:var(--field);color:var(--ink);padding:0 14px;font-size:12px}
.field input.focus{border-color:color-mix(in srgb,var(--accent) 52%,var(--line));box-shadow:0 0 0 4px var(--accent-soft)}
.field input.err{border-color:color-mix(in srgb,var(--danger) 55%,var(--line));box-shadow:0 0 0 4px color-mix(in srgb,var(--danger) 12%,transparent)}
.field input::placeholder,.search input::placeholder{color:var(--faint)}
.field-help{margin-top:7px;color:var(--muted);font-size:9px;line-height:1.45}
.field-help.err{color:var(--danger)}
.input-shell{position:relative}.input-shell input{padding-left:42px}
.field-icon{position:absolute;z-index:2;left:13px;top:50%;transform:translateY(-50%);color:var(--muted);display:grid}
.field-icon svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.75}
.search{position:relative}.search input{padding-left:41px}

.auth{position:absolute;z-index:2;inset:0;padding:60px 23px 27px;display:flex;flex-direction:column}
.auth-top{display:flex;align-items:center;justify-content:space-between}
.auth-mark{position:relative;width:50px;height:50px;border:1px solid var(--line);border-radius:17px;display:grid;place-items:center;background:var(--panel);font:600 11px/1 var(--mono);letter-spacing:.08em}
.auth-mark:before,.auth-mark:after{content:"";position:absolute;background:var(--accent);box-shadow:0 0 11px var(--accent)}
.auth-mark:before{width:9px;height:1px;right:-5px}.auth-mark:after{width:1px;height:9px;bottom:-5px}
.auth-kicker{margin-top:44px;color:var(--muted);font:600 9px/1 var(--mono);letter-spacing:.14em}
.auth-title{margin:15px 0 0;font-size:31px;line-height:1.08;letter-spacing:-.055em}
.auth-copy{margin:11px 0 26px;color:var(--muted);font-size:11px;line-height:1.6}
.auth-form{display:grid;gap:16px}
.auth-trust{margin-top:20px;display:flex;align-items:center;justify-content:center;gap:8px;color:var(--muted);font-size:9px}
.auth-trust svg{width:15px;height:15px;fill:none;stroke:var(--accent);stroke-width:1.7}
.auth-foot{margin:auto 0 0;text-align:center;color:var(--muted);font:500 8px/1.55 var(--mono)}
.text-btn{padding:0;border:0;background:transparent;color:var(--ink);font-size:10px;font-weight:600}

.filter-line{display:flex;gap:14px;border-bottom:1px solid var(--line);overflow:hidden}
.filter{position:relative;height:44px;padding:0 4px;border:0;background:transparent;color:var(--muted);font-size:11px;white-space:nowrap}
.filter:after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:1px;background:var(--accent);opacity:0}
.filter.active{color:var(--ink)}.filter.active:after{opacity:1}
.cat-label{margin:16px 0 4px;color:var(--muted);font:600 9px/1 var(--mono);letter-spacing:.1em}
.poster{width:66px;height:37px;flex:0 0 auto;border-radius:11px;border:1px solid var(--line);background:radial-gradient(circle at 67% 29%,rgba(126,151,255,.7),transparent 17%),linear-gradient(145deg,#1b2130,#080a0e)}
.poster.alt{background:radial-gradient(circle at 67% 29%,rgba(189,198,255,.55),transparent 17%),linear-gradient(145deg,#2e2835,#0a0b0e)}
.poster.soft{background:radial-gradient(circle at 67% 29%,rgba(121,235,221,.5),transparent 17%),linear-gradient(145deg,#24302f,#080a0c)}
.media-list{border-top:1px solid var(--line)}
.media-row{min-height:66px;display:flex;align-items:center;gap:11px;border-bottom:1px solid var(--line);padding:9px 2px}
.media-row:last-child{border-bottom:0}
.state-chip{font:500 8px/1 var(--mono);letter-spacing:.05em;padding:3px 6px;border:1px solid var(--line);border-radius:6px;color:var(--muted)}
.state-chip.plan{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 30%,var(--line))}
.state-chip.done{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 30%,var(--line))}

.floating-add{position:absolute;z-index:11;right:20px;bottom:88px;min-width:90px;height:45px;padding:0 15px;border:1px solid color-mix(in srgb,var(--cta) 80%,var(--line));border-radius:15px;background:var(--cta);color:var(--cta-ink);display:flex;align-items:center;justify-content:center;gap:7px;font-size:11px;font-weight:600;box-shadow:0 17px 36px rgba(8,11,18,.18),0 0 24px var(--glow)}
.floating-add svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.9}

.state-block{margin-top:60px;text-align:center;padding:0 26px}
.state-orb{width:60px;height:60px;margin:0 auto 18px;border:1px solid var(--line);border-radius:20px;display:grid;place-items:center;background:var(--panel);color:var(--accent)}
.state-orb svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:1.6}
.state-orb.danger{color:var(--danger)}
.state-title{font-size:16px;font-weight:700;letter-spacing:-.02em}
.state-copy{margin:9px auto 22px;max-width:230px;color:var(--muted);font-size:11px;line-height:1.6}
.skeleton{border-radius:12px;background:linear-gradient(100deg,var(--field) 30%,color-mix(in srgb,var(--ink) 6%,var(--field)) 50%,var(--field) 70%);background-size:200% 100%}
.spinner{width:15px;height:15px;border:1.6px solid currentColor;border-right-color:transparent;border-radius:50%;display:inline-block;animation:spin .8s linear infinite}
.spinner.big{width:26px;height:26px;border-width:2px;color:var(--accent)}
@keyframes spin{to{transform:rotate(360deg)}}

.calendar-panel{padding:16px 13px 13px;margin-top:4px}
.calendar-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.cal-year{font:500 8px/1 var(--mono);letter-spacing:.1em;color:var(--muted)}
.month{font-size:16px;font-weight:600;margin-top:4px}
.calendar-nav{display:flex;gap:5px}
.calendar-nav .icon-btn{width:38px;height:38px;border-radius:11px}
.calendar-nav .icon-btn svg{width:16px;height:16px}
.week,.dates{display:grid;grid-template-columns:repeat(7,1fr);text-align:center}
.week{color:var(--muted);font:500 8px/1 var(--mono);letter-spacing:.05em;margin-bottom:4px}
.date{position:relative;height:42px;display:grid;place-items:center;border-radius:11px;font-size:11px;border:0;background:transparent;color:var(--ink)}
.date.dim{color:var(--faint)}
.date.plan:after{content:"";position:absolute;bottom:6px;width:3px;height:3px;border-radius:50%;background:var(--accent);box-shadow:0 0 8px var(--accent)}
.date.active{color:var(--cta-ink);background:var(--cta)}
.date.active:after{background:var(--accent)}
.timeline{border-left:1px solid var(--line);margin-left:4px;margin-top:12px}
.time-item{position:relative;padding:0 0 17px 17px}
.time-item:before{content:"";position:absolute;left:-4px;top:4px;width:7px;height:7px;border-radius:50%;background:var(--bg);border:1px solid var(--accent);box-shadow:0 0 9px var(--glow)}
.time-code{color:var(--muted);font:500 8px/1 var(--mono);letter-spacing:.05em}
.time-title{margin-top:5px;font-size:12px;font-weight:600}
.time-note{margin-top:3px;color:var(--muted);font-size:9px}
.calendar-quiet{margin-top:6px;padding:13px 0;border-top:1px solid var(--line);display:flex;align-items:flex-start;gap:11px}
.calendar-quiet>span{width:34px;height:34px;flex:0 0 auto;border:1px solid var(--line);border-radius:11px;display:grid;place-items:center;color:var(--muted);background:var(--panel)}
.calendar-quiet svg{width:16px;height:16px}
.calendar-quiet strong{font-size:11px}
.calendar-quiet p{margin:4px 0 0;color:var(--muted);font-size:9px;line-height:1.55}

.pair-hero{padding:6px 0 18px;text-align:center;border-bottom:1px solid var(--line)}
.pair-orbit{position:relative;width:176px;height:112px;margin:5px auto 6px}
.orbit{position:absolute;inset:12px 0;border:1px solid var(--line);border-radius:50%;transform:rotate(-8deg)}
.orbit:after{content:"";position:absolute;right:12px;top:9px;width:5px;height:5px;border-radius:50%;background:var(--accent);box-shadow:0 0 13px var(--accent)}
.pair-orbit .avatar{position:absolute;top:37px;width:43px;height:43px}
.pair-orbit .avatar:first-of-type{left:39px}
.pair-orbit .avatar.second{right:39px}
.pair-center{position:absolute;left:50%;bottom:0;transform:translateX(-50%);white-space:nowrap;text-align:center}
.pair-center strong{display:block;font-size:14px}
.pair-center span{display:block;margin-top:3px;color:var(--muted);font:500 8px/1 var(--mono)}
.pair-signal{display:inline-flex;align-items:center;margin-top:5px;color:var(--muted);font-size:9px}

.sheet-backdrop{position:absolute;z-index:30;inset:0;background:rgba(2,4,8,.50)}
.sheet{position:absolute;z-index:31;left:8px;right:8px;bottom:8px;padding:10px 17px 18px;border:1px solid var(--line);border-radius:22px;background:var(--panel-strong);backdrop-filter:blur(28px);box-shadow:0 28px 80px rgba(0,0,0,.28)}
.sheet-handle{width:34px;height:3px;margin:1px auto 17px;border-radius:3px;background:var(--line)}
.sheet-title{font-size:18px;font-weight:600;letter-spacing:-.025em}
.sheet-copy{margin:6px 0 16px;color:var(--muted);font-size:9px;line-height:1.55}
.sheet-form{display:grid;gap:12px}
.parse-row{display:flex;align-items:center;gap:9px;padding:9px 0;border-top:1px solid var(--line);font-size:10px}
.parse-row .row-end{margin-left:auto}
.parse-ico{width:24px;height:24px;border-radius:8px;display:grid;place-items:center;flex:0 0 auto}
.parse-ico svg{width:13px;height:13px;fill:none;stroke:currentColor;stroke-width:2}
.parse-ok{color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,transparent)}
.parse-warn{color:var(--accent);background:var(--accent-soft)}
.parse-bad{color:var(--danger);background:color-mix(in srgb,var(--danger) 14%,transparent)}

.toast{position:absolute;z-index:40;left:18px;right:18px;bottom:87px;min-height:45px;padding:0 13px;border:1px solid var(--line);border-radius:14px;background:var(--cta);color:var(--cta-ink);display:flex;align-items:center;gap:9px;font-size:10px;font-weight:500;box-shadow:0 18px 50px rgba(0,0,0,.22)}
.toast svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2}

.opt-row{display:flex;gap:12px;padding:14px;border:1px solid var(--line);border-radius:15px;background:var(--panel);align-items:flex-start}
.opt-row.sel{border-color:color-mix(in srgb,var(--accent) 50%,var(--line));background:var(--accent-soft)}
.opt-radio{width:18px;height:18px;border-radius:50%;border:1.5px solid var(--muted);flex:0 0 auto;margin-top:1px;display:grid;place-items:center}
.opt-row.sel .opt-radio{border-color:var(--accent)}
.opt-row.sel .opt-radio:after{content:"";width:9px;height:9px;border-radius:50%;background:var(--accent)}
.opt-row strong{font-size:12px;font-weight:600}
.opt-row p{margin:4px 0 0;color:var(--muted);font-size:9.5px;line-height:1.5}

/* 观看页 */
.watch{position:absolute;z-index:2;inset:0;padding:52px 18px 16px;display:flex;flex-direction:column;overflow:hidden}
.watchbar{display:flex;align-items:center;gap:9px;margin-bottom:12px}
.watch .icon-btn{width:42px;height:42px}
.room{flex:1;min-width:0}
.room-title{font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.01em}
.room-sub{margin-top:3px;color:var(--muted);font-size:10px;display:flex;align-items:center}
.player{width:100%;aspect-ratio:16/9;border-radius:16px;overflow:hidden;position:relative;background:#08090b;border:1px solid var(--line)}
.player .scene{position:absolute;inset:0;background:radial-gradient(circle at 70% 32%,rgba(126,151,255,.42),transparent 20%),linear-gradient(150deg,#222a38 0%,#141924 42%,#080a0e 100%)}
.player .scene:before{content:"";position:absolute;left:0;right:0;bottom:0;height:40%;background:linear-gradient(12deg,#0a0c11 0 44%,#2a2f3d 45% 56%,#101319 57%)}
.center-play{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:52px;height:52px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.94);color:#111}
.center-play svg{width:19px;height:19px;fill:#111;stroke:none;margin-left:2px}
.sync-chip{position:absolute;left:12px;top:12px;padding:6px 10px;border-radius:999px;background:rgba(8,9,11,.66);color:#eef;font:600 10px/1 var(--font);backdrop-filter:blur(8px);display:flex;align-items:center;gap:6px}
.sync-chip .dot{margin:0;box-shadow:0 0 8px var(--accent)}
.video-cap{position:absolute;left:14px;bottom:12px;color:#fff;font-size:12px;font-weight:600;text-shadow:0 1px 4px #000}
.ready-note{text-align:center;font-size:10px;color:var(--muted);margin-top:11px}
.wtimeline{margin-top:12px}
.time-row{display:flex;justify-content:space-between;font:500 10px/1 var(--mono);color:var(--muted);margin-bottom:8px}
.track{height:4px;background:var(--line);border-radius:999px;position:relative}
.track .fill{position:absolute;inset:0 auto 0 0;background:var(--accent);border-radius:999px;box-shadow:0 0 10px var(--accent)}
.track .knob{position:absolute;top:50%;transform:translate(-50%,-50%);width:12px;height:12px;background:var(--cta);border:2px solid var(--bg);border-radius:50%}
.wtools{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
.wtool{min-width:0;height:60px;border:1px solid var(--line);border-radius:13px;background:var(--panel);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-size:10px;font-weight:600;color:var(--ink)}
.wtool svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.7}
.wtool span.on{color:var(--accent)}
.wmember{margin-top:12px;padding:11px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:11px}
.wmember .avatar{width:34px;height:34px}
.wmember-main{flex:1;min-width:0}
.wmember-name{font-size:12px;font-weight:600}
.wmember-sub{margin-top:3px;color:var(--muted);font-size:9.5px}
.wmember .status-word{font:600 10px/1 var(--font);color:var(--accent)}
.msg-card{margin-top:12px;flex:1;min-height:0;display:flex;flex-direction:column;border:1px solid var(--line);border-radius:16px;background:var(--panel);overflow:hidden}
.msg-scroll{flex:1;padding:12px;display:flex;flex-direction:column;gap:9px;overflow:hidden}
.msg{max-width:78%;padding:8px 11px;border-radius:13px;font-size:11px;line-height:1.4}
.msg.them{align-self:flex-start;background:var(--field);border:1px solid var(--line);border-bottom-left-radius:5px}
.msg.me{align-self:flex-end;background:var(--cta);color:var(--cta-ink);border-bottom-right-radius:5px}
.msg-sys{align-self:center;font:500 9px/1 var(--mono);color:var(--muted);padding:2px 0}
.composer{display:flex;gap:8px;padding:9px;border-top:1px solid var(--line);background:var(--panel-strong)}
.composer .say{flex:1;height:40px;border:1px solid var(--line);border-radius:12px;background:var(--field);color:var(--faint);display:flex;align-items:center;padding:0 13px;font-size:11px}
.composer .send{width:44px;height:40px;border-radius:12px;background:var(--cta);color:var(--cta-ink);border:0;display:grid;place-items:center}
.composer .send svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:2}

.watch.land{flex-direction:row;padding:16px;gap:14px}
.watch.land .lplayer{flex:1;min-width:0;aspect-ratio:auto;height:100%}
.watch.land .lside{width:288px;flex:0 0 auto;display:flex;flex-direction:column;min-height:0}
.watch.land .lside .watchbar{margin-bottom:10px}
.watch.land .msg-card{margin-top:10px}
.watch.land .wtimeline{margin-top:10px}

.drawer-scrim{position:absolute;z-index:30;inset:0;background:rgba(2,4,8,.5)}
.drawer-bottom{position:absolute;z-index:31;left:0;right:0;bottom:0;height:64%;padding:12px 18px 18px;border-radius:22px 22px 0 0;border:1px solid var(--line);border-bottom:0;background:var(--panel-strong);backdrop-filter:blur(28px)}
.drawer-right{position:absolute;z-index:31;top:0;right:0;bottom:0;width:300px;padding:16px;border-left:1px solid var(--line);background:var(--panel-strong);backdrop-filter:blur(28px)}
.drawer-title{font-size:15px;font-weight:700;letter-spacing:-.02em;margin-bottom:4px}
.drawer-sub{color:var(--muted);font-size:9.5px;margin-bottom:12px}

.legend{max-width:1500px;margin:36px auto 0;padding:18px 20px;border:1px solid var(--studio-line);border-radius:16px;background:color-mix(in srgb,var(--studio) 70%,transparent);color:var(--studio-muted);font-size:12px;line-height:1.7}
.legend b{color:var(--studio-ink)}
.legend code{font-family:var(--mono);font-size:11px;padding:1px 5px;border-radius:5px;background:color-mix(in srgb,var(--studio-ink) 8%,transparent);color:var(--studio-ink)}
.swatch{display:inline-block;width:11px;height:11px;border-radius:3px;vertical-align:middle;margin-right:5px;border:1px solid rgba(128,128,128,.3)}
@media(prefers-reduced-motion:reduce){.spinner{animation-duration:1.4s}}

/* ============================================================
   视觉增强补丁 · P0 / P1
   ============================================================ */

/* --- 字重标准化 --- */
/* 非标准 720/680/650 → 实际渲染到 700，直接声明 800 让大标题更有重量感 */
.page-title            { font-weight: 800; letter-spacing: -.06em; }
.auth-title            { font-weight: 800; }
.now-title             { font-weight: 800; }
.section-label         { font-weight: 700; }
.room-title            { font-weight: 800; }
.drawer-title, .sheet-title { font-weight: 700; }

/* --- 白色主题：面板层次感 --- */
/* 顶部内侧高光 + 底部细投影，让面板脱离背景而不用加厚重阴影 */
.panel {
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.88),   /* 顶部玻璃高光 */
    0 2px 14px rgba(12,17,25,.055),        /* 底部漫反射 */
    0 1px 3px  rgba(12,17,25,.04);
}
/* now-card 需要更强的浮起感，它是视觉焦点 */
.now-card {
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.92),
    0 24px 56px rgba(12,17,25,.10),
    0 4px  12px rgba(12,17,25,.06);
}
/* presence 卡片——轻一点 */
.panel.presence {
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.84),
    0 1px 8px rgba(12,17,25,.045);
}

/* --- 黑色主题：面板用冷光边界替代高光 --- */
.studio.dark .panel {
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.055),   /* 极淡顶光 */
    0 0 0 1px rgba(145,167,255,.07),        /* 冷光边框晕 */
    0 4px 20px rgba(0,0,0,.28);
}
.studio.dark .now-card {
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.06),
    0 0 0 1px rgba(145,167,255,.1),
    0 28px 70px rgba(0,0,0,.38),
    0 0 60px rgba(111,139,255,.06);         /* 冷光漫散 */
}

/* --- 设备外壳金属高光边 --- */
.device {
  box-shadow:
    0 22px 50px rgba(15,20,30,.20),
    inset 0  1px 0 rgba(255,255,255,.14),   /* 顶部高光 */
    inset 0 -1px 0 rgba(0,0,0,.55),         /* 底部压暗 */
    inset 1px 0 0 rgba(255,255,255,.06),    /* 左侧反光 */
    inset -1px 0 0 rgba(0,0,0,.32);         /* 右侧暗边 */
}
.studio.dark .device {
  box-shadow:
    0 26px 66px rgba(0,0,0,.55),
    inset 0  1px 0 rgba(255,255,255,.10),
    inset 0 -1px 0 rgba(0,0,0,.70),
    inset 1px 0 0 rgba(255,255,255,.04),
    inset -1px 0 0 rgba(0,0,0,.45);
}

/* --- 连接轨道节点：从 6px 放大到 8px，box-shadow 收紧聚焦 --- */
.link-track:before,
.link-track:after {
  width:  8px;
  height: 8px;
  box-shadow: 0 0 0 3px var(--accent-soft), 0 0 10px var(--accent);
}

/* --- 顶部光晕：白色主题下缩小范围反而更聚焦 --- */
.screen:after {
  width:   240px;
  height:  200px;
  opacity: .65;
}
.studio.dark .screen:after {
  width:   320px;
  height:  260px;
  opacity: .80;
}

/* --- now-card 光晕扩大，增加存在感 --- */
.now-card:before {
  width:  210px;
  height: 210px;
  right: -70px;
  top:   -80px;
  opacity: .85;
}

/* --- 海报新增暖色系 variant --- */
.poster.warm {
  background:
    radial-gradient(circle at 33% 72%, rgba(255,184,110,.52), transparent 20%),
    linear-gradient(155deg, #2a1e12, #0c0906);
}

/* --- icon-btn / button 微细腻化 --- */
/* 给 icon-btn 加与面板一致的顶部高光，和 panel 系列统一语言 */
.icon-btn {
  box-shadow: inset 0 1px 0 rgba(255,255,255,.75), 0 1px 4px rgba(12,17,25,.06);
}
.studio.dark .icon-btn {
  box-shadow: inset 0 1px 0 rgba(255,255,255,.06), 0 1px 6px rgba(0,0,0,.22);
}
/* 普通描边 button 也跟上 */
.button:not(.primary):not(.danger) {
  box-shadow: inset 0 1px 0 rgba(255,255,255,.82), 0 1px 4px rgba(12,17,25,.05);
}
.studio.dark .button:not(.primary):not(.danger) {
  box-shadow: inset 0 1px 0 rgba(255,255,255,.055), 0 1px 5px rgba(0,0,0,.20);
}

/* --- Bottom sheet 深色加强：让抽屉和背景更有分离感 --- */
.sheet {
  box-shadow:
    0 -1px 0 rgba(255,255,255,.22) inset,   /* 顶部高光线 */
    0 28px 80px rgba(0,0,0,.28),
    0 0 0 1px rgba(255,255,255,.08) inset;
}
.studio.dark .sheet {
  box-shadow:
    0 -1px 0 rgba(255,255,255,.08) inset,
    0 28px 80px rgba(0,0,0,.60),
    0 0 0 1px rgba(145,167,255,.10) inset;
}

/* --- 搜索框、输入框：加顶部暗线让内凹感更真实 --- */
.field input, .field textarea, .search input {
  box-shadow: inset 0 1px 3px rgba(12,17,25,.07);
}
.studio.dark .field input,
.studio.dark .field textarea,
.studio.dark .search input {
  box-shadow: inset 0 1px 4px rgba(0,0,0,.28);
}

/* --- 进度条 fill 发光加强 --- */
.track .fill {
  box-shadow: 0 0 0 2px var(--accent-soft), 0 0 12px var(--accent);
}

/* --- 消息气泡——对方气泡加顶部高光 --- */
.msg.them {
  box-shadow: inset 0 1px 0 rgba(255,255,255,.72);
}
.studio.dark .msg.them {
  box-shadow: inset 0 1px 0 rgba(255,255,255,.06);
}
</style>

/* ---------- 日历 ---------- */
function calGrid(){
  const plan=[6,15,21];const active=19;let cells='';
  const lead=[28,29,30,31];lead.forEach(d=>cells+=`<button class="date dim">${d}</button>`);
  for(let d=1;d<=31;d++){const cl=[];if(d===active)cl.push('active');if(plan.includes(d))cl.push('plan');cells+=`<button class="date ${cl.join(' ')}">${d}</button>`;}
  [1,2].forEach(d=>cells+=`<button class="date dim">${d}</button>`);
  return `<div class="week"><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span><span>日</span></div><div class="dates">${cells}</div>`;
}

function frame(fn,label,tag,land){

}
function render(){
  let html=`<div class="studio-header"><div><div class="studio-code">TONGKAN · ALPHA 10 · BREATH TECH</div><h1>同看 高保真设计稿</h1><p>基于已选定的 Breath Tech 视觉真源 · 覆盖登录 / 首页 / 片库 / 日历 / 我们 / 观看页全部核心页面与状态。黑白双主题，冷光蓝仅用于焦点、连接与计划点。</p></div>
  <div class="studio-controls"><div class="theme-toggle"><button id="tLight" class="active" onclick="setTheme(false)">白色</button><button id="tDark" onclick="setTheme(true)">黑色</button></div></div></div>`;
  SECTIONS.forEach(sec=>{
    html+=`<div class="section-block"><h2><span class="sec-idx">${sec.idx}</span>${sec.title}</h2><p class="sec-desc">${sec.desc}</p><div class="grid">`;
    sec.rows.forEach(r=>{html+=frame(r[0],r[1],r[2],r[3]);});

  });
  html+=`<div class="legend"><b>设计说明 ·</b> 全部对齐 <code>design/alpha10-ui/breath-tech.css</code> 的 token 真源。
  颜色：白色主题背景 <span class="swatch" style="background:#f7f8fa"></span><code>#F7F8FA</code>、主操作 <span class="swatch" style="background:#101218"></span><code>#101218</code>、冷光蓝 <span class="swatch" style="background:#637fff"></span><code>#637FFF</code>；黑色主题背景 <span class="swatch" style="background:#05070a"></span><code>#05070A</code>、冷光蓝 <span class="swatch" style="background:#91a7ff"></span><code>#91A7FF</code>。
  几何：页面边距 21dp · 主按钮圆角 14dp / 面板 19dp · 触控目标 ≥44px · 封面统一 16:9。<br><b>落地约束 ·</b> 原生 Java View 实现，不依赖复杂模糊 / 粒子 / 实时渐变；上方所有效果均可用 <code>GradientDrawable</code> + <code>StateListDrawable</code> + Ripple 表达。<b>切换右上角"黑色"查看深色主题。</b></div>`;

function setTheme(dark){
  document.getElementById('studio').classList.toggle('dark',dark);

}
