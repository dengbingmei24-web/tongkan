name: 审查结论
description: 审查执行任务并给出接受、退回或阻塞结论
title: "[Review] TK-XXX-WX "
labels:
  - review
body:
  - type: input
    id: worker_issue
    attributes:
      label: Worker Issue / 任务合同
      placeholder: Issue URL 与 task-contract 路径
    validations:
      required: true
  - type: input
    id: baseline
    attributes:
      label: 基线提交
      placeholder: Worker 分支开始时的提交哈希
    validations:
      required: true
  - type: input
    id: commit
    attributes:
      label: 被审查提交或 Draft PR
    validations:
      required: true
  - type: dropdown
    id: verdict
    attributes:
      label: 结论
      options:
        - APPROVED
        - CHANGES_REQUESTED
        - BLOCKED
    validations:
      required: true
  - type: textarea
    id: findings
    attributes:
      label: Findings
      description: 按严重级别、文件路径、问题和修复要求列出；没有问题时写“无”。
    validations:
      required: true
  - type: textarea
    id: validation
    attributes:
      label: 审查验证
      description: 列出实际运行的命令、结果和未覆盖范围。
    validations:
      required: true
  - type: textarea
    id: next
    attributes:
      label: 下一动作
      description: 接受后如何集成，或退回后必须修改和复验的具体内容。
    validations:
      required: true
