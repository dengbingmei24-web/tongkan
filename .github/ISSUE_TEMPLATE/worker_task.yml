name: 执行任务合同
description: 为一个隔离执行任务创建可审查、可退回的工作包
title: "[Worker] TK-XXX-WX "
labels:
  - worker-task
body:
  - type: input
    id: feature
    attributes:
      label: Spec Kit 功能目录
      placeholder: specs/TK-001-unilateral-unbind
    validations:
      required: true
  - type: input
    id: baseline
    attributes:
      label: 基线提交
      placeholder: 完整提交哈希
    validations:
      required: true
  - type: input
    id: branch
    attributes:
      label: 分支
      placeholder: codex/TK-001-W1-account
    validations:
      required: true
  - type: input
    id: worktree
    attributes:
      label: Worktree 绝对路径
      placeholder: C:\...\tongkan-worktrees\TK-001-W1-account
    validations:
      required: true
  - type: textarea
    id: goal
    attributes:
      label: 目标与非目标
      description: 写一个可验证目标，并明确本任务不做什么。
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: 写入范围
      description: 逐行列出允许修改的路径；未列出的路径默认禁止。
    validations:
      required: true
  - type: textarea
    id: contracts
    attributes:
      label: 冻结合同与依赖
      description: API、数据模型、依赖提交和不得自行改变的约束。
    validations:
      required: true
  - type: textarea
    id: validation
    attributes:
      label: 必须验证
      description: 列出命令、人工验收和预期结果。
    validations:
      required: true
  - type: checkboxes
    id: guardrails
    attributes:
      label: 执行边界
      options:
        - label: 不修改 CONTEXT.md、docs/decisions/DECISIONS.md、全局 PRD 或生产部署状态。
          required: true
        - label: 不提交 Secret、APK、Firebase JSON、服务账号 JSON 或构建产物。
          required: true
        - label: 不自行合并、部署、rebase 或 force push。
          required: true
