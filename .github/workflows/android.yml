name: Android CI

on:
  push:
    paths:
      - "apps/android/**"
      - "qa/protocol-contract/**"
      - "packages/protocol/**"
      - "apps/signaling/src/message-validation.ts"
      - "apps/signaling/src/android-contract.test.ts"
      - "scripts/run-android-gradle.mjs"
      - "package.json"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "apps/android/**"
      - "qa/protocol-contract/**"
      - "packages/protocol/**"
      - "apps/signaling/src/message-validation.ts"
      - "apps/signaling/src/android-contract.test.ts"
      - "scripts/run-android-gradle.mjs"
      - "package.json"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v6

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses >/dev/null || true

      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Run Android tests, Lint and Debug build
        working-directory: apps/android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace testDebugUnitTest lintDebug assembleDebug

      - name: Upload Debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: tongkan-android-debug-${{ github.sha }}
          path: apps/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload Android test and Lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tongkan-android-reports-${{ github.sha }}
          path: |
            apps/android/app/build/reports/tests/testDebugUnitTest
            apps/android/app/build/test-results/testDebugUnitTest
            apps/android/app/build/reports/lint-results-debug.html
            apps/android/app/build/reports/lint-results-debug.xml
          if-no-files-found: warn
          retention-days: 14
