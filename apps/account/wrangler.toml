name = "tongkan-account"
main = "src/worker.ts"
compatibility_date = "2026-08-03"
workers_dev = false

[vars]
AUTH_TEST_MODE = "false"
SMTP_HOST = "smtp.qq.com"
SMTP_PORT = "465"
SMTP_FROM_NAME = "同看"
CODE_TTL_SECONDS = "300"
CODE_RESEND_SECONDS = "60"
SESSION_TTL_SECONDS = "2592000"
PUSH_PROVIDER = "fcm"

[[d1_databases]]
binding = "DB"
database_name = "tongkan-account"
database_id = "8a2e1477-8206-49d2-9c23-6887724ef62c"
migrations_dir = "migrations"

[env.preview]
name = "tongkan-account-preview"
workers_dev = false
preview_urls = false
vars = { AUTH_TEST_MODE = "true", SMTP_HOST = "smtp.qq.com", SMTP_PORT = "465", SMTP_FROM_NAME = "同看", CODE_TTL_SECONDS = "300", CODE_RESEND_SECONDS = "60", SESSION_TTL_SECONDS = "2592000", PUSH_PROVIDER = "fcm" }

[[env.preview.d1_databases]]
binding = "DB"
database_name = "tongkan-account-preview"
database_id = "7b67c5ae-73a7-45ba-9d3e-37af106bf9b8"
migrations_dir = "migrations"
