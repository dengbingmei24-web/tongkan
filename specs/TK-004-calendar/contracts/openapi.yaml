openapi: 3.1.0
info:
  title: Tongkan Calendar API
  version: 1.0.0-alpha10.3
  description: Shared pair calendar contract for TK-004. Production deployment requires separate approval.
servers:
  - url: https://tongkan-personal.pages.dev
security:
  - bearerAuth: []
paths:
  /api/calendar:
    get:
      summary: Read active pair calendar by month or date
      parameters:
        - in: query
          name: month
          schema:
            type: string
            pattern: '^\d{4}-(0[1-9]|1[0-2])$'
        - in: query
          name: date
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Calendar snapshot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CalendarSnapshot'
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/AuthRequired' }
        '409': { $ref: '#/components/responses/PairRequired' }
  /api/calendar/today:
    get:
      summary: Read active pair planned items for one date
      parameters:
        - in: query
          name: date
          required: true
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Today snapshot containing only planned items
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CalendarSnapshot'
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/AuthRequired' }
        '409': { $ref: '#/components/responses/PairRequired' }
  /api/calendar/plans:
    post:
      summary: Create a plan from an active shared-library item
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePlanRequest'
      responses:
        '201':
          description: Updated calendar snapshot for the created plan date
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CalendarSnapshot'
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/AuthRequired' }
        '404': { $ref: '#/components/responses/LibraryItemNotFound' }
        '409':
          description: Pair missing, duplicate plan, or stale revision
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/calendar/plans/{planId}:
    parameters:
      - in: path
        name: planId
        required: true
        schema:
          $ref: '#/components/schemas/HexId'
    patch:
      summary: Update date, time, note, or status
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePlanRequest'
      responses:
        '200':
          description: Updated calendar snapshot for the plan date
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CalendarSnapshot'
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/AuthRequired' }
        '404': { $ref: '#/components/responses/PlanNotFound' }
        '409':
          description: Pair missing, duplicate plan, or stale revision
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      summary: Cancel a plan
      parameters:
        - in: query
          name: expectedRevision
          required: true
          schema:
            type: integer
            minimum: 0
      responses:
        '200':
          description: Updated calendar snapshot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CalendarSnapshot'
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/AuthRequired' }
        '404': { $ref: '#/components/responses/PlanNotFound' }
        '409':
          description: Pair missing or stale revision
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/pair/archives/{pairId}/calendar:
    get:
      summary: Read a kept archive calendar
      parameters:
        - in: path
          name: pairId
          required: true
          schema:
            $ref: '#/components/schemas/HexId'
        - in: query
          name: month
          required: true
          schema:
            type: string
            pattern: '^\d{4}-(0[1-9]|1[0-2])$'
      responses:
        '200':
          description: Read-only archived calendar
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/CalendarSnapshot'
                  - type: object
                    properties:
                      readOnly:
                        const: true
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/AuthRequired' }
        '403':
          description: Archive is not retained by the caller
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Pair archive does not exist
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    HexId:
      type: string
      pattern: '^[a-f0-9]{32}$'
    CalendarDate:
      type: string
      format: date
    StartTime:
      type: [string, 'null']
      pattern: '^([01]\d|2[0-3]):[0-5]\d$'
    PlanStatus:
      type: string
      enum: [planned, completed]
    PublicActor:
      type: object
      required: [id, nickname]
      properties:
        id: { type: string }
        nickname: { type: string, minLength: 1, maxLength: 40 }
    CalendarMedia:
      type: object
      required: [bvid, page, canonicalUrl, title, coverUrl]
      properties:
        bvid: { type: string }
        page: { type: integer, minimum: 1 }
        canonicalUrl: { type: string, format: uri, maxLength: 1000 }
        title: { type: string, minLength: 1, maxLength: 160 }
        coverUrl:
          type: [string, 'null']
          format: uri
          maxLength: 1000
    CalendarPlan:
      type: object
      required:
        - id
        - libraryItemId
        - date
        - startTime
        - note
        - status
        - media
        - createdBy
        - updatedBy
        - createdAt
        - updatedAt
        - completedAt
      properties:
        id: { $ref: '#/components/schemas/HexId' }
        libraryItemId:
          anyOf:
            - $ref: '#/components/schemas/HexId'
            - type: 'null'
        date: { $ref: '#/components/schemas/CalendarDate' }
        startTime: { $ref: '#/components/schemas/StartTime' }
        note:
          type: [string, 'null']
          maxLength: 200
        status: { $ref: '#/components/schemas/PlanStatus' }
        media: { $ref: '#/components/schemas/CalendarMedia' }
        createdBy: { $ref: '#/components/schemas/PublicActor' }
        updatedBy: { $ref: '#/components/schemas/PublicActor' }
        createdAt: { type: integer, minimum: 1 }
        updatedAt: { type: integer, minimum: 1 }
        completedAt:
          type: [integer, 'null']
          minimum: 1
    CalendarRange:
      type: object
      required: [from, to]
      properties:
        from: { $ref: '#/components/schemas/CalendarDate' }
        to: { $ref: '#/components/schemas/CalendarDate' }
    CalendarSnapshot:
      type: object
      required: [pairId, revision, readOnly, range, plans]
      properties:
        pairId: { $ref: '#/components/schemas/HexId' }
        revision: { type: integer, minimum: 0 }
        readOnly: { type: boolean }
        range: { $ref: '#/components/schemas/CalendarRange' }
        plans:
          type: array
          items: { $ref: '#/components/schemas/CalendarPlan' }
    CreatePlanRequest:
      type: object
      additionalProperties: false
      required: [libraryItemId, date, expectedRevision]
      properties:
        libraryItemId: { $ref: '#/components/schemas/HexId' }
        date: { $ref: '#/components/schemas/CalendarDate' }
        startTime: { $ref: '#/components/schemas/StartTime' }
        note:
          type: [string, 'null']
          maxLength: 200
        expectedRevision: { type: integer, minimum: 0 }
    UpdatePlanRequest:
      type: object
      additionalProperties: false
      required: [expectedRevision]
      minProperties: 2
      properties:
        date: { $ref: '#/components/schemas/CalendarDate' }
        startTime: { $ref: '#/components/schemas/StartTime' }
        note:
          type: [string, 'null']
          maxLength: 200
        status: { $ref: '#/components/schemas/PlanStatus' }
        expectedRevision: { type: integer, minimum: 0 }
    ErrorResponse:
      type: object
      required: [error, message]
      properties:
        error:
          type: string
          enum:
            - INVALID_REQUEST
            - AUTH_REQUIRED
            - PAIR_REQUIRED
            - ARCHIVE_FORBIDDEN
            - NOT_FOUND
            - LIBRARY_ITEM_NOT_FOUND
            - PLAN_NOT_FOUND
            - PLAN_ALREADY_EXISTS
            - CALENDAR_VERSION_CONFLICT
        message: { type: string }
        currentRevision:
          type: integer
          minimum: 0
  responses:
    InvalidRequest:
      description: Invalid date, time, note, ID, query shape, or request body
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    AuthRequired:
      description: Missing or invalid session
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    PairRequired:
      description: Caller has no active pair
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    LibraryItemNotFound:
      description: Library item is not in the active pair
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    PlanNotFound:
      description: Plan is not in the active pair
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
