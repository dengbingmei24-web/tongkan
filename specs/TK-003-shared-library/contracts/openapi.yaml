openapi: 3.1.0
info:
  title: Tongkan Shared Library API
  version: 0.1.0
servers:
  - url: /account-api
security:
  - bearerAuth: []
paths:
  /api/library:
    get:
      summary: Read the current active pair library snapshot
      parameters:
        - in: query
          name: query
          schema: { type: string, maxLength: 80 }
        - in: query
          name: status
          schema: { type: string, enum: [all, unwatched, watched], default: all }
        - in: query
          name: categoryId
          schema: { type: string, pattern: '^[a-f0-9]{32}$' }
      responses:
        '200':
          description: Active library snapshot
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LibrarySnapshot' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/LibraryConflict' }
  /api/library/categories:
    post:
      summary: Create a custom category
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, expectedRevision]
              properties:
                name: { type: string, minLength: 1, maxLength: 24 }
                expectedRevision: { type: integer, minimum: 0 }
      responses:
        '201': { $ref: '#/components/responses/LibrarySnapshotResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/LibraryConflict' }
  /api/library/categories/{categoryId}:
    patch:
      summary: Rename a category
      parameters:
        - $ref: '#/components/parameters/CategoryId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, expectedRevision]
              properties:
                name: { type: string, minLength: 1, maxLength: 24 }
                expectedRevision: { type: integer, minimum: 0 }
      responses:
        '200': { $ref: '#/components/responses/LibrarySnapshotResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/LibraryConflict' }
    delete:
      summary: Delete category and leave its items uncategorized
      parameters:
        - $ref: '#/components/parameters/CategoryId'
        - in: query
          name: expectedRevision
          required: true
          schema: { type: integer, minimum: 0 }
      responses:
        '200': { $ref: '#/components/responses/LibrarySnapshotResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/LibraryConflict' }
  /api/library/categories/reorder:
    post:
      summary: Reorder all custom categories
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [orderedCategoryIds, expectedRevision]
              properties:
                orderedCategoryIds:
                  type: array
                  maxItems: 100
                  uniqueItems: true
                  items: { type: string, pattern: '^[a-f0-9]{32}$' }
                expectedRevision: { type: integer, minimum: 0 }
      responses:
        '200': { $ref: '#/components/responses/LibrarySnapshotResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/LibraryConflict' }
  /api/library/items/batch:
    post:
      summary: Add up to 20 Bilibili links
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [inputs, expectedRevision]
              properties:
                inputs:
                  type: array
                  minItems: 1
                  maxItems: 20
                  items: { type: string, minLength: 1, maxLength: 2000 }
                categoryId:
                  type: [string, 'null']
                  pattern: '^[a-f0-9]{32}$'
                expectedRevision: { type: integer, minimum: 0 }
      responses:
        '200':
          description: Per-input results and authoritative snapshot
          content:
            application/json:
              schema:
                type: object
                required: [results, library]
                properties:
                  results:
                    type: array
                    items: { $ref: '#/components/schemas/BatchItemResult' }
                  library: { $ref: '#/components/schemas/LibrarySnapshot' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/LibraryConflict' }
  /api/library/items/{itemId}:
    patch:
      summary: Update category or watched state
      parameters:
        - $ref: '#/components/parameters/ItemId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [expectedRevision]
              properties:
                categoryId:
                  type: [string, 'null']
                  pattern: '^[a-f0-9]{32}$'
                watchStatus: { type: string, enum: [unwatched, watched] }
                refreshMetadata: { type: boolean, default: false }
                expectedRevision: { type: integer, minimum: 0 }
      responses:
        '200': { $ref: '#/components/responses/LibrarySnapshotResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/LibraryConflict' }
    delete:
      summary: Delete an item
      parameters:
        - $ref: '#/components/parameters/ItemId'
        - in: query
          name: expectedRevision
          required: true
          schema: { type: integer, minimum: 0 }
      responses:
        '200': { $ref: '#/components/responses/LibrarySnapshotResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/LibraryConflict' }
  /api/library/items/reorder:
    post:
      summary: Reorder every item in the active library
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [orderedItemIds, expectedRevision]
              properties:
                orderedItemIds:
                  type: array
                  maxItems: 1000
                  uniqueItems: true
                  items: { type: string, pattern: '^[a-f0-9]{32}$' }
                expectedRevision: { type: integer, minimum: 0 }
      responses:
        '200': { $ref: '#/components/responses/LibrarySnapshotResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/LibraryConflict' }
  /api/pair/archives/{pairId}/library:
    get:
      summary: Read a kept pair library as a read-only snapshot
      parameters:
        - in: path
          name: pairId
          required: true
          schema: { type: string, pattern: '^[a-f0-9]{32}$' }
      responses:
        '200':
          description: Read-only archive snapshot
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LibrarySnapshot' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/ArchiveForbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  parameters:
    CategoryId:
      in: path
      name: categoryId
      required: true
      schema: { type: string, pattern: '^[a-f0-9]{32}$' }
    ItemId:
      in: path
      name: itemId
      required: true
      schema: { type: string, pattern: '^[a-f0-9]{32}$' }
  schemas:
    PublicActor:
      type: object
      required: [id, nickname]
      properties:
        id: { type: string }
        nickname: { type: string }
    LibraryCategory:
      type: object
      required: [id, name, position, createdAt, updatedAt]
      properties:
        id: { type: string }
        name: { type: string }
        position: { type: integer }
        createdAt: { type: integer }
        updatedAt: { type: integer }
    LibraryItem:
      type: object
      required: [id, bvid, page, canonicalUrl, title, metadataStatus, watchStatus, position, addedBy, updatedBy, createdAt, updatedAt]
      properties:
        id: { type: string }
        bvid: { type: string }
        page: { type: integer, minimum: 1 }
        cid: { type: [integer, 'null'] }
        canonicalUrl: { type: string, format: uri }
        title: { type: string }
        coverUrl: { type: [string, 'null'], format: uri }
        ownerName: { type: [string, 'null'] }
        durationSeconds: { type: [integer, 'null'], minimum: 0 }
        metadataStatus: { type: string, enum: [ready, partial] }
        categoryId: { type: [string, 'null'] }
        watchStatus: { type: string, enum: [unwatched, watched] }
        position: { type: integer }
        addedBy: { $ref: '#/components/schemas/PublicActor' }
        updatedBy: { $ref: '#/components/schemas/PublicActor' }
        createdAt: { type: integer }
        updatedAt: { type: integer }
    LibrarySnapshot:
      type: object
      required: [pairId, revision, readOnly, categories, items]
      properties:
        pairId: { type: string }
        revision: { type: integer, minimum: 0 }
        readOnly: { type: boolean }
        categories:
          type: array
          items: { $ref: '#/components/schemas/LibraryCategory' }
        items:
          type: array
          items: { $ref: '#/components/schemas/LibraryItem' }
    BatchItemResult:
      type: object
      required: [input, status]
      properties:
        input: { type: string }
        status: { type: string, enum: [added, duplicate, rejected] }
        item: { oneOf: [{ $ref: '#/components/schemas/LibraryItem' }, { type: 'null' }] }
        error:
          oneOf:
            - { $ref: '#/components/schemas/BatchItemErrorCode' }
            - { type: 'null' }
    BatchItemErrorCode:
      type: string
      enum: [INVALID_BILIBILI_URL, B23_RESOLUTION_FAILED, CATEGORY_NOT_FOUND, LIBRARY_LIMIT_REACHED]
    ErrorCode:
      type: string
      enum: [UNAUTHORIZED, INVALID_REQUEST, INVALID_JSON, JSON_REQUIRED, ARCHIVE_FORBIDDEN, NOT_FOUND, PAIR_REQUIRED, LIBRARY_VERSION_CONFLICT, CATEGORY_NAME_CONFLICT, LIBRARY_LIMIT_REACHED]
    Error:
      type: object
      required: [error, message]
      properties:
        error: { $ref: '#/components/schemas/ErrorCode' }
        message: { type: string }
        currentRevision:
          type: integer
          minimum: 0
          description: Required when error is LIBRARY_VERSION_CONFLICT
  responses:
    LibrarySnapshotResponse:
      description: Authoritative library snapshot
      content:
        application/json:
          schema: { $ref: '#/components/schemas/LibrarySnapshot' }
    BadRequest:
      description: Invalid JSON, content type or request fields
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthorized:
      description: Missing or invalid session
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    ArchiveForbidden:
      description: Archive is pending, deleted or not owned by requester
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    LibraryConflict:
      description: No active pair, stale revision, duplicate category name or library limit
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: Resource not found or not visible
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
