openapi: 3.1.0
info:
  title: Tongkan Pair Unbind Contract
  version: 0.2.0
paths:
  /api/pair/unbind:
    post:
      summary: End the current active pair immediately
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [pairId, retention]
              properties:
                pairId: { type: string, pattern: '^[a-f0-9]{32}$' }
                retention: { $ref: '#/components/schemas/RetentionDecision' }
      responses:
        '200': { $ref: '#/components/responses/PairMutationSuccess' }
        '400': { $ref: '#/components/responses/InvalidRetention' }
        '401': { $ref: '#/components/responses/AuthRequired' }
        '404':
          description: Target pair is absent, deleted or not visible to current user
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example: { error: PAIR_ARCHIVE_NOT_FOUND, message: 旧空间不存在或已删除。 }
        '409':
          description: No active pair or concurrent state change
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              examples:
                noActive: { value: { error: PAIR_NOT_ACTIVE, message: 当前没有可解绑的好友关系。 } }
                conflict: { value: { error: PAIR_UNBIND_CONFLICT, message: 绑定状态刚刚发生变化，请刷新后重试。 } }
  /api/pair/archives/{pairId}/retention:
    post:
      summary: Submit the current user's pending retention decision
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: pairId
          required: true
          schema: { type: string, pattern: '^[a-f0-9]{32}$' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [retention]
              properties:
                retention: { $ref: '#/components/schemas/RetentionDecision' }
      responses:
        '200': { $ref: '#/components/responses/PairMutationSuccess' }
        '400': { $ref: '#/components/responses/InvalidRetention' }
        '401': { $ref: '#/components/responses/AuthRequired' }
        '404':
          description: Archive is absent, deleted or not visible to current user
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example: { error: PAIR_ARCHIVE_NOT_FOUND, message: 旧空间不存在或已删除。 }
        '409':
          description: A different retention decision was already finalized
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example: { error: PAIR_RETENTION_FINAL, message: 数据保留选择已经确认，不能修改。 }
  /api/pair:
    get:
      summary: Get active pair plus current user's archive state
      description: pendingArchives and archives are ordered by unboundAt descending, then pairId ascending. Delete records are never returned.
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Current pair state
          content:
            application/json:
              schema:
                type: object
                required: [pair, pendingArchives, archives]
                properties:
                  pair:
                    oneOf:
                      - { $ref: '#/components/schemas/ActivePair' }
                      - { type: 'null' }
                  pendingArchives:
                    type: array
                    items: { $ref: '#/components/schemas/ArchiveState' }
                  archives:
                    type: array
                    items: { $ref: '#/components/schemas/ArchiveState' }
        '401': { $ref: '#/components/responses/AuthRequired' }
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer }
  responses:
    PairMutationSuccess:
      description: Retention state stored; pairDeleted is true only when both users selected delete
      content:
        application/json:
          schema: { $ref: '#/components/schemas/PairMutationResult' }
    InvalidRetention:
      description: retention must be keep or delete
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example: { error: PAIR_RETENTION_INVALID, message: 请选择保留或删除旧空间。 }
    AuthRequired:
      description: Authentication required
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example: { error: AUTH_REQUIRED, message: 请先登录。 }
  schemas:
    RetentionDecision: { type: string, enum: [keep, delete] }
    ErrorResponse:
      type: object
      required: [error, message]
      properties:
        error: { type: string }
        message: { type: string }
    PublicUserSnapshot:
      type: object
      required: [id, email, nickname, avatarId]
      properties:
        id: { type: string }
        email: { type: string, description: Masked email captured at unbind time }
        nickname: { type: string, description: Nickname captured at unbind time }
        avatarId: { type: string, description: Avatar captured at unbind time }
    ActivePair:
      type: object
      required: [pairId, boundAt, partner]
      properties:
        pairId: { type: string }
        boundAt: { type: integer }
        partner: { $ref: '#/components/schemas/PublicUserSnapshot' }
    ArchiveState:
      type: object
      required: [pairId, boundAt, unboundAt, retention, partner]
      properties:
        pairId: { type: string }
        boundAt: { type: integer }
        unboundAt: { type: integer }
        retention: { type: string, enum: [pending, keep] }
        partner: { $ref: '#/components/schemas/PublicUserSnapshot' }
    PairMutationResult:
      type: object
      required: [archive, pairDeleted]
      properties:
        archive:
          description: Current user's visible archive after the mutation; null for delete
          oneOf:
            - { $ref: '#/components/schemas/ArchiveState' }
            - { type: 'null' }
        pairDeleted:
          type: boolean
          description: True only when this mutation physically deleted the pair and its child data
