openapi: 3.1.0
info:
  title: Tongkan Watch History API
  version: 1.0.0-alpha10.4-draft
  description: >-
    Draft TK-005 contract for account room grants, idempotent Signaling ingest,
    shared watch history, monthly summaries, calendar markers and kept archives.
    Implementation and deployment require separate approval.
servers:
  - url: https://tongkan-personal.pages.dev
security:
  - bearerAuth: []
paths:
  /api/history/grants:
    post:
      summary: Issue or refresh an opaque account-bound room history grant
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GrantRequest'
      responses:
        '200':
          description: Grant issued or refreshed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GrantResponse'
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/AuthRequired' }
        '403':
          description: Caller cannot use the requested room slot or source
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '409':
          description: Pair missing, active room missing, or room is bound to another source
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /api/history:
    get:
      summary: Read active pair watch history
      parameters:
        - $ref: '#/components/parameters/HistoryCursor'
        - $ref: '#/components/parameters/HistoryLimit'
      responses:
        '200':
          description: Stable reverse-chronological history page
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HistoryPage' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/AuthRequired' }
        '409': { $ref: '#/components/responses/PairRequired' }
  /api/history/monthly:
    get:
      summary: Read active pair monthly watch summary
      parameters:
        - $ref: '#/components/parameters/Month'
        - $ref: '#/components/parameters/TzOffsetMinutes'
      responses:
        '200':
          description: Monthly summary using the requested fixed UTC offset
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MonthlySummary' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/AuthRequired' }
        '409': { $ref: '#/components/responses/PairRequired' }
  /api/history/calendar-markers:
    get:
      summary: Read actual-watch markers for the active pair calendar
      parameters:
        - $ref: '#/components/parameters/Month'
        - $ref: '#/components/parameters/TzOffsetMinutes'
      responses:
        '200':
          description: Actual-watch day markers; does not mutate calendar revision
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CalendarMarkers' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/AuthRequired' }
        '409': { $ref: '#/components/responses/PairRequired' }
  /api/pair/archives/{pairId}/history:
    get:
      summary: Read kept archive watch history
      parameters:
        - $ref: '#/components/parameters/PairId'
        - $ref: '#/components/parameters/HistoryCursor'
        - $ref: '#/components/parameters/HistoryLimit'
      responses:
        '200':
          description: Read-only archive history page
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HistoryPage' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/AuthRequired' }
        '403': { $ref: '#/components/responses/ArchiveForbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/pair/archives/{pairId}/history/monthly:
    get:
      summary: Read kept archive monthly watch summary
      parameters:
        - $ref: '#/components/parameters/PairId'
        - $ref: '#/components/parameters/Month'
        - $ref: '#/components/parameters/TzOffsetMinutes'
      responses:
        '200':
          description: Read-only archive monthly summary
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MonthlySummary' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/AuthRequired' }
        '403': { $ref: '#/components/responses/ArchiveForbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/pair/archives/{pairId}/history/calendar-markers:
    get:
      summary: Read kept archive actual-watch calendar markers
      parameters:
        - $ref: '#/components/parameters/PairId'
        - $ref: '#/components/parameters/Month'
        - $ref: '#/components/parameters/TzOffsetMinutes'
      responses:
        '200':
          description: Read-only archive actual-watch markers
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CalendarMarkers' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/AuthRequired' }
        '403': { $ref: '#/components/responses/ArchiveForbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /internal/history/sources/{roomId}/snapshot:
    post:
      summary: Idempotently ingest Signaling overlap intervals through Service Binding
      description: >-
        This route is not a public Android API. The request must arrive through the
        configured Account Service Binding and carry both timestamp and body HMAC headers.
      security:
        - historyTimestamp: []
          historySignature: []
      parameters:
        - in: path
          name: roomId
          required: true
          schema: { $ref: '#/components/schemas/HexId' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/IngestSnapshot' }
      responses:
        '200':
          description: Snapshot accepted, replayed, or ignored as stale
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IngestAck' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401':
          description: Missing, expired, or invalid internal request signature
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '403':
          description: Source revoked, expired, or no longer authorized
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          description: Source does not exist
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '409':
          description: Source identity or immutable interval content conflicts
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque session token
    historyTimestamp:
      type: apiKey
      in: header
      name: X-Tongkan-History-Timestamp
    historySignature:
      type: apiKey
      in: header
      name: X-Tongkan-History-Signature
  parameters:
    PairId:
      in: path
      name: pairId
      required: true
      schema: { $ref: '#/components/schemas/HexId' }
    HistoryCursor:
      in: query
      name: cursor
      required: false
      schema:
        type: string
        minLength: 1
        maxLength: 512
    HistoryLimit:
      in: query
      name: limit
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 50
        default: 20
    Month:
      in: query
      name: month
      required: true
      schema: { $ref: '#/components/schemas/Month' }
    TzOffsetMinutes:
      in: query
      name: tzOffsetMinutes
      required: true
      schema:
        type: integer
        minimum: -840
        maximum: 840
  schemas:
    HexId:
      type: string
      pattern: '^[a-f0-9]{32}$'
    Month:
      type: string
      pattern: '^\d{4}-(0[1-9]|1[0-2])$'
    CalendarDate:
      type: string
      format: date
    RoomSlot:
      type: string
      enum: [host, guest]
    GrantRequest:
      type: object
      additionalProperties: false
      required: [roomId, slot]
      properties:
        roomId: { $ref: '#/components/schemas/HexId' }
        slot: { $ref: '#/components/schemas/RoomSlot' }
    GrantResponse:
      type: object
      required: [sourceId, pairId, roomId, slot, grant, expiresAt, refreshAfter]
      properties:
        sourceId: { $ref: '#/components/schemas/HexId' }
        pairId: { $ref: '#/components/schemas/HexId' }
        roomId: { $ref: '#/components/schemas/HexId' }
        slot: { $ref: '#/components/schemas/RoomSlot' }
        grant:
          type: string
          minLength: 20
          maxLength: 4096
        expiresAt: { type: integer, minimum: 1 }
        refreshAfter: { type: integer, minimum: 1 }
    HistoryMedia:
      type: object
      required: [bvid, page, canonicalUrl, title, coverUrl]
      properties:
        bvid:
          type: string
          minLength: 3
          maxLength: 32
        page: { type: integer, minimum: 1 }
        canonicalUrl:
          type: string
          format: uri
          maxLength: 1000
        title:
          type: string
          minLength: 1
          maxLength: 160
        coverUrl:
          type: [string, 'null']
          format: uri
          maxLength: 1000
    CompletionState:
      type: string
      enum: [unknown, completed, incomplete]
    HistoryItem:
      type: object
      required:
        - id
        - roomId
        - startedAt
        - endedAt
        - watchedSeconds
        - completionState
        - media
      properties:
        id: { $ref: '#/components/schemas/HexId' }
        roomId: { $ref: '#/components/schemas/HexId' }
        startedAt: { type: integer, minimum: 1 }
        endedAt: { type: integer, minimum: 1 }
        watchedSeconds: { type: integer, minimum: 1 }
        completionState: { $ref: '#/components/schemas/CompletionState' }
        media: { $ref: '#/components/schemas/HistoryMedia' }
    HistoryPage:
      type: object
      required: [pairId, readOnly, nextCursor, items]
      properties:
        pairId: { $ref: '#/components/schemas/HexId' }
        readOnly: { type: boolean }
        nextCursor:
          type: [string, 'null']
          maxLength: 512
        items:
          type: array
          maxItems: 50
          items: { $ref: '#/components/schemas/HistoryItem' }
    DailyWatchSummary:
      type: object
      required: [date, watchedSeconds, sessionCount]
      properties:
        date: { $ref: '#/components/schemas/CalendarDate' }
        watchedSeconds: { type: integer, minimum: 1 }
        sessionCount: { type: integer, minimum: 1 }
    MonthlySummary:
      type: object
      required:
        - pairId
        - readOnly
        - month
        - tzOffsetMinutes
        - totalWatchedSeconds
        - sessionCount
        - distinctVideoCount
        - completedCount
        - lastWatchedDate
        - days
      properties:
        pairId: { $ref: '#/components/schemas/HexId' }
        readOnly: { type: boolean }
        month: { $ref: '#/components/schemas/Month' }
        tzOffsetMinutes:
          type: integer
          minimum: -840
          maximum: 840
        totalWatchedSeconds: { type: integer, minimum: 0 }
        sessionCount: { type: integer, minimum: 0 }
        distinctVideoCount: { type: integer, minimum: 0 }
        completedCount:
          type: [integer, 'null']
          minimum: 0
        lastWatchedDate:
          anyOf:
            - $ref: '#/components/schemas/CalendarDate'
            - type: 'null'
        days:
          type: array
          maxItems: 31
          items: { $ref: '#/components/schemas/DailyWatchSummary' }
    CalendarMarker:
      type: object
      required: [date, watchedSeconds, sessionCount]
      properties:
        date: { $ref: '#/components/schemas/CalendarDate' }
        watchedSeconds: { type: integer, minimum: 1 }
        sessionCount: { type: integer, minimum: 1 }
    CalendarMarkers:
      type: object
      required: [pairId, readOnly, month, tzOffsetMinutes, markers]
      properties:
        pairId: { $ref: '#/components/schemas/HexId' }
        readOnly: { type: boolean }
        month: { $ref: '#/components/schemas/Month' }
        tzOffsetMinutes:
          type: integer
          minimum: -840
          maximum: 840
        markers:
          type: array
          maxItems: 31
          items: { $ref: '#/components/schemas/CalendarMarker' }
    IngestParticipants:
      type: object
      additionalProperties: false
      required: [hostUserId, guestUserId]
      properties:
        hostUserId: { $ref: '#/components/schemas/HexId' }
        guestUserId: { $ref: '#/components/schemas/HexId' }
    IngestMedia:
      type: object
      additionalProperties: false
      required: [bvid, page, canonicalUrl]
      properties:
        bvid:
          type: string
          minLength: 3
          maxLength: 32
        page: { type: integer, minimum: 1 }
        canonicalUrl:
          type: string
          format: uri
          maxLength: 1000
        titleHint:
          type: [string, 'null']
          maxLength: 160
    IntervalEndReason:
      type: string
      enum:
        - pause
        - buffering
        - stale-report
        - disconnect
        - media-change
        - ended
        - grant-expired
        - history-unbind
        - room-expired
        - checkpoint
    IngestInterval:
      type: object
      additionalProperties: false
      required:
        - intervalId
        - sessionId
        - media
        - startedAt
        - endedAt
        - endReason
      properties:
        intervalId: { $ref: '#/components/schemas/HexId' }
        sessionId: { $ref: '#/components/schemas/HexId' }
        media: { $ref: '#/components/schemas/IngestMedia' }
        startedAt: { type: integer, minimum: 1 }
        endedAt: { type: integer, minimum: 1 }
        endReason: { $ref: '#/components/schemas/IntervalEndReason' }
        durationSecondsHint:
          type: [number, 'null']
          exclusiveMinimum: 0
    IngestSnapshot:
      type: object
      additionalProperties: false
      required:
        - sourceId
        - pairId
        - roomId
        - sourceRevision
        - observedAt
        - closed
        - participants
        - intervals
      properties:
        sourceId: { $ref: '#/components/schemas/HexId' }
        pairId: { $ref: '#/components/schemas/HexId' }
        roomId: { $ref: '#/components/schemas/HexId' }
        sourceRevision: { type: integer, minimum: 1 }
        observedAt: { type: integer, minimum: 1 }
        closed: { type: boolean }
        participants: { $ref: '#/components/schemas/IngestParticipants' }
        intervals:
          type: array
          maxItems: 256
          items: { $ref: '#/components/schemas/IngestInterval' }
    IngestAck:
      type: object
      required: [sourceId, acceptedRevision, acceptedIntervalIds, stale]
      properties:
        sourceId: { $ref: '#/components/schemas/HexId' }
        acceptedRevision: { type: integer, minimum: 0 }
        acceptedIntervalIds:
          type: array
          maxItems: 256
          items: { $ref: '#/components/schemas/HexId' }
        stale: { type: boolean }
    ErrorResponse:
      type: object
      required: [error, message]
      properties:
        error:
          type: string
          enum:
            - INVALID_REQUEST
            - AUTH_REQUIRED
            - PAIR_REQUIRED
            - ARCHIVE_FORBIDDEN
            - NOT_FOUND
            - HISTORY_SOURCE_NOT_FOUND
            - HISTORY_SOURCE_CONFLICT
            - HISTORY_SOURCE_REVOKED
            - HISTORY_GRANT_FORBIDDEN
            - HISTORY_GRANT_EXPIRED
            - HISTORY_SIGNATURE_INVALID
            - HISTORY_INTERVAL_CONFLICT
        message: { type: string }
        acceptedRevision:
          type: integer
          minimum: 0
  responses:
    InvalidRequest:
      description: Invalid ID, month, offset, cursor, signature header, or request body
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    AuthRequired:
      description: Missing or invalid account session
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    PairRequired:
      description: Caller has no active pair
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    ArchiveForbidden:
      description: Archive retention is pending/delete or caller is not a member
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    NotFound:
      description: Requested archive or history resource does not exist
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
